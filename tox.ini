[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
DJANGO =
    4.2: dj42
    5.2: dj52

[tox]
usedevelop = True

envlist =
    py3{11,12}-dj{42,52}
    py313-dj52

[testenv]
basepython =
    py311: python3.11
    py312: python3.12
    py313: python3.13

deps =
    dj42: Django>=4.2,<5.0
    dj52: Django>=5.2,<6.0

extras =
    tests

commands =
    flake8 revproxy
    coverage run --branch --source=revproxy {envbindir}/django-admin test --pythonpath=./ --settings=tests.settings
    coverage report --fail-under=90 --show-missing
