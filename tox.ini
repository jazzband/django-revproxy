[gh-actions]
python =
    3.11: py311

[gh-actions:env]
DJANGO =
    4.1: dj41
    4.2: dj42

[tox]
usedevelop = True

envlist =
    py311-dj{41,42}

[testenv]
basepython =
    py311: python3.11

deps =
    dj41: Django>=4.1.3,<4.2
    dj42: Django>=4.2,<5.0

extras =
    tests

commands =
    flake8 revproxy
    coverage run --branch --source=revproxy {envbindir}/django-admin test --pythonpath=./ --settings=tests.settings
    coverage report --fail-under=90 --show-missing
